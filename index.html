<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#11110F" />

    <!-- Browser tab and home-screen icons. Both use the existing Ombre ring
         mark; Vite bundles it and fills in the final address. -->
    <link rel="icon" type="image/png" href="/ombre-mark-transparent.png" />
    <link rel="apple-touch-icon" href="/ombre-mark-transparent.png" />

    <!-- TEMPORARY: keeps search engines from listing this unfinished page.
         Remove this tag, and the X-Robots-Tag header in vercel.json, when
         the product launches. See LAUNCH-CHECKLIST.md. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Ombre | An AI workspace that works with you</title>
    <meta
      name="description"
      content="Ombre brings General AI, specialized Mentors, and Projects into one workspace, with context that carries from one step to the next."
    />

    <!-- Share previews (WhatsApp, LinkedIn, X and others).
         The addresses below use the current Vercel address. When a custom
         domain is attached, replace https://ombre-landing-page.vercel.app
         with it in og:url and og:image. X reads the og: tags, so only the
         card type is set for it. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ombre" />
    <meta property="og:url" content="https://ombre-landing-page.vercel.app/" />
    <meta
      property="og:title"
      content="Ombre | An AI workspace that works with you"
    />
    <meta
      property="og:description"
      content="Ombre brings General AI, specialized Mentors, and Projects into one workspace, with context that carries from one step to the next."
    />
    <meta
      property="og:image"
      content="https://ombre-landing-page.vercel.app/ombre-share.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Ombre logo on a dark background"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- If scripts are off, show everything instead of leaving content hidden
         waiting to fade in. -->
    <noscript>
      <style>
        .reveal {
          opacity: 1 !important;
          transform: none !important;
        }
        .headline__word {
          transform: none !important;
        }
      </style>
    </noscript>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
