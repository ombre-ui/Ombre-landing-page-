<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120F" />

    <!-- An error page should never be listed by search engines. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Something went wrong | Ombre</title>
    <meta name="description" content="Something went wrong." />

    <!-- Paint the page colour immediately, before the stylesheet loads. -->
    <style>
      html,
      body {
        margin: 0;
        background: #14120f;
        color: #f2efe8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Plain fallback for when scripts are off. React replaces it. -->
      <main style="padding: 4rem 1.5rem; text-align: center">
        <h1>500</h1>
        <p>Something went wrong.</p>
        <p><a href="/" style="color: #c8b99a">Back to Ombre</a></p>
      </main>
    </div>
    <script type="module" src="/src/servererror-main.jsx"></script>
  </body>
</html>
