<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14120F" />

    <!-- Same Ombre ring icons as the landing page. -->
    <link rel="icon" type="image/png" href="/ombre-mark-transparent.png" />
    <link rel="apple-touch-icon" href="/ombre-mark-transparent.png" />

    <!-- A missing page should never be listed by search engines. Vercel serves
         this file with a real 404 status for any address that does not exist. -->
    <meta name="robots" content="noindex, nofollow" />

    <title>Page not found | Ombre</title>
    <meta name="description" content="This page doesn't exist." />

    <!-- Paint the page colour immediately, before the stylesheet loads. -->
    <style>
      html,
      body {
        margin: 0;
        background: #14120f;
        color: #f2efe8;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Plain fallback for when scripts are off. React replaces it. -->
      <main style="padding: 4rem 1.5rem; text-align: center">
        <h1>404</h1>
        <p>This page doesn&rsquo;t exist.</p>
        <p><a href="/" style="color: #c8b99a">Back to Ombre</a></p>
      </main>
    </div>
    <script type="module" src="/src/notfound-main.jsx"></script>
  </body>
</html>
